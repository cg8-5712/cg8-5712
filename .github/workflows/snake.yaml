name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main


jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=ffb6c1&color_dots=#fdf2f8,#e0f2fe,#bae6fd,#c7d2fe,#ffb6c1
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=ffb6c1&color_dots=#1e293b,#475569,#93c5fd,#c4b5fd,#fbcfe8


      - name: Push snake assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
