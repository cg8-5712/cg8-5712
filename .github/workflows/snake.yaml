name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main


jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ffb6c1&color_dots=%23fdf2f8,%23e0f2fe,%23bae6fd,%23c7d2fe,%23ffb6c1
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ffb6c1&color_dots=%231e293b,%23475569,%2393c5fd,%23c4b5fd,%23fbcfe8
      - name: Push snake assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
